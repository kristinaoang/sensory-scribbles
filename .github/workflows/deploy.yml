name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Build client bundle
        run: npm run build

      - name: Upload production artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: sensory-scribbles-dist
          retention-days: 7
          path: |
            dist
            server.ts
            src/server
            src/mastra
            src/shared
            src/types.ts
            db
            package*.json
            tsconfig.json

  deploy:
    name: Deploy Full-Stack Server
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check deployment secrets
        id: check_secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping remote SSH deploy: configure DEPLOY_HOST, DEPLOY_USER, and DEPLOY_SSH_KEY in GitHub Repository Secrets to enable automatic deployment."
          fi

      - name: Download production artifact
        if: steps.check_secrets.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: sensory-scribbles-dist
          path: ./release

      - name: Configure SSH key
        if: steps.check_secrets.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync release to server
        if: steps.check_secrets.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/sensory-scribbles' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DEPLOY_PATH}'"
          rsync -avz --delete \
            --exclude '.env' \
            --exclude '*.db' \
            --exclude '*.db-shm' \
            --exclude '*.db-wal' \
            --exclude 'node_modules' \
            -e "ssh -i ~/.ssh/deploy_key -p ${DEPLOY_PORT}" \
            ./release/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Install production deps and restart app
        if: steps.check_secrets.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/sensory-scribbles' }}
          SERVICE_NAME: ${{ vars.DEPLOY_SERVICE_NAME || 'sensory-scribbles' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s << 'EOF'
            set -euo pipefail
            cd "${DEPLOY_PATH}"
            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi
            if command -v pm2 >/dev/null 2>&1 && pm2 describe "${SERVICE_NAME}" >/dev/null 2>&1; then
              NODE_ENV=production pm2 restart "${SERVICE_NAME}" --update-env
            elif command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files | grep -q "^${SERVICE_NAME}\.service"; then
              sudo systemctl restart "${SERVICE_NAME}"
            else
              echo "Files synced to ${DEPLOY_PATH}. Ensure your process manager (pm2 or systemd) runs: NODE_ENV=production npm start"
            fi
          EOF
